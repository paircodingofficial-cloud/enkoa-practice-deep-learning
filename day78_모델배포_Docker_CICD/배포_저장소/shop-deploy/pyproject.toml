[project]
name = "shop-deploy"
version = "0.1.0"
description = "온라인 쇼핑 상담 API(배포용). 서버 실행에 필요한 라이브러리만 담는다"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.133.0,<0.137.0",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
    "openai>=2.45.0,<3",          # day77 서빙 코드를 검증한 버전(2.x)
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.2",  # day77 서빙 코드가 설정(config.py 의 Settings)을 읽는 라이브러리
]

# 배포 전 테스트에만 쓰는 라이브러리. 이미지에는 넣지 않는다(uv sync --no-dev)
[dependency-groups]
dev = ["pytest>=9.1.1"]

# 이 저장소는 설치할 패키지가 아니라 서버 코드 모음이다
[tool.uv]
package = false

# tests/ 의 단위 테스트가 저장소 맨 위의 shop_api 를 import 하도록 저장소 맨 위를 import 경로에 더한다
[tool.pytest.ini_options]
pythonpath = ["."]
