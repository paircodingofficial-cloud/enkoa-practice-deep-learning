[project]
name = "enkoa-practice-deep-learning"
version = "0.1.0"
description = "엔코아 AI캠퍼스 딥러닝 실습자료"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.3.0",
    # 저장소 환경에서 바로 Jupyter Lab·Notebook을 띄울 수 있게 한다(uv run jupyter lab)
    "jupyter>=1.1",
    "numpy>=2.3",
    "pandas>=2.3,<3",
    "matplotlib>=3.11",
    # day65~: PyTorch. 리눅스(RunPod)는 아래 cu128 인덱스에서 CUDA 12.8 빌드를 받는다.
    #   PyPI 기본 리눅스 휠은 더 새 CUDA 로 빌드될 수 있어, 드라이버가 CUDA 12.8 까지만 되는 파드에서 GPU 를 못 잡는다.
    #   cu128 빌드가 나오는 마지막 줄기(2.11)에 맞춰 맥·윈도우도 같은 버전을 쓴다.
    "torch>=2.11,<2.12",
    # day65~: 학습용과 테스트용 나누기(train_test_split, stratify)
    "scikit-learn>=1.7",
    # day66~: 학습 코드 정리(LightningModule, Trainer, 조기 종료 콜백)
    "lightning>=2.6,<2.7",
    # day68~: 오픈소스 LLM 로컬 실행(Transformers 로 불러와 생성, Hub 모델 정보 조회, Ollama 파이썬 클라이언트)
    #   Ollama 프로그램 자체는 따로 설치한다(day68 설치_가이드.md)
    "transformers>=5.13,<6",
    #   huggingface-hub 2.x 는 click>=8.4.2 를 요구해 deepeval(click<8.4, day70)과 함께 설치되지 않는다
    "huggingface-hub>=1.13,<1.33",
    "ollama>=0.6",
    # day68~: 로컬 Ollama 모델을 LangChain 에 연결(ChatOllama 의 구조화된 출력·도구 호출)
    "langchain-ollama>=1.1",
    # day68~: 같은 도구 호출을 create_agent 로 실행(교안 01 4-5)
    "langchain>=1.0",
    "langchain-core>=1.6",
    "pydantic>=2",
    # day69~: 파인튜닝 데이터셋 만들기(생성용 LLM 호출, .env 의 API 키 읽기)
    "python-dotenv>=1.2",
    "langchain-openai>=1.3.5",
    # day69~: 새 질문의 근거 조문 검색기(law_retriever.py). BM25 키워드 검색 + Chroma 의미 검색을 합치고 Cross-Encoder 로 재정렬한다
    #   BM25Retriever -> rank_bm25, 한국어 토큰화 -> kiwipiepy, HuggingFaceCrossEncoder(Qwen3-Reranker-0.6B) -> sentence-transformers
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4,<0.4.2",
    "langchain-chroma>=1.1",
    "rank-bm25>=0.2.2",
    "kiwipiepy>=0.23.2",
    "sentence-transformers>=5.6",
    # day70~: 지도 파인튜닝(SFTTrainer 학습, jsonl 데이터셋 불러오기, 학습 기록)
    #   SFTTrainer -> trl, Dataset -> datasets, Trainer 의 장치 배치 -> accelerate, report_to=["mlflow"] -> mlflow
    "trl>=1.8,<2",
    "datasets>=5.0",
    "accelerate>=1.14",
    #   mlflow 3.17 은 import 때 코딩 에이전트용 안내 줄을 찍어, 교안을 만든 3.14 줄기에 맞춘다
    "mlflow>=3.14,<3.15",
    # day70~: Base·Tuned 답 채점(Jev 판사 JevEval, TYPESAFE_API_KEY)
    "deepeval>=4.2.9",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
