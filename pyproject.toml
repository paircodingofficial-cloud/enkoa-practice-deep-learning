[project]
name = "enkoa-practice-deep-learning"
version = "0.1.0"
description = "엔코아 AI캠퍼스 딥러닝 실습자료"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.3.0",
    # 저장소 환경에서 바로 Jupyter Lab·Notebook을 띄울 수 있게 한다(uv run jupyter lab)
    "jupyter>=1.1",
    "numpy>=2.3",
    "pandas>=2.3,<3",
    "matplotlib>=3.11",
    # vLLM 0.27.0과 맞춘 PyTorch. Linux RunPod은 CUDA 13.0 휠을, PC는 OS별 PyPI 휠을 쓴다.
    "torch==2.13.0+cu130 ; sys_platform == 'linux'",
    "torch==2.13.0 ; sys_platform != 'linux'",
    "torchvision==0.28.0+cu130 ; sys_platform == 'linux'",
    "triton==3.7.1 ; sys_platform == 'linux'",
    "vllm==0.27.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # day65~: 학습용과 테스트용 나누기(train_test_split, stratify)
    "scikit-learn>=1.7",
    # day66~: 학습 코드 정리(LightningModule, Trainer, 조기 종료 콜백)
    "lightning>=2.6,<2.7",
    # day68~: 오픈소스 LLM 로컬 실행(Transformers 로 불러와 생성, Hub 모델 정보 조회, Ollama 파이썬 클라이언트)
    #   Ollama 프로그램 자체는 따로 설치한다(day68 설치_가이드.md)
    "transformers>=5.13,<6",
    #   huggingface-hub 2.x 는 click>=8.4.2 를 요구해 deepeval(click<8.4, day70)과 함께 설치되지 않는다
    "huggingface-hub>=1.13,<1.33",
    "ollama>=0.6",
    # day68~: 로컬 Ollama 모델을 LangChain 에 연결(ChatOllama 의 구조화된 출력·도구 호출)
    "langchain-ollama>=1.1",
    # day68~: 같은 도구 호출을 create_agent 로 실행(교안 01 4-5)
    "langchain>=1.0",
    "langchain-core>=1.6",
    "pydantic>=2",
    # day69~: 파인튜닝 데이터셋 만들기(생성용 LLM 호출, .env 의 API 키 읽기)
    "python-dotenv>=1.2",
    "langchain-openai>=1.3.5",
    # day69~: 새 질문의 근거 조문 검색기(law_retriever.py). BM25 키워드 검색 + Chroma 의미 검색을 합치고 Cross-Encoder 로 재정렬한다
    #   BM25Retriever -> rank_bm25, 한국어 토큰화 -> kiwipiepy, HuggingFaceCrossEncoder(Qwen3-Reranker-0.6B) -> sentence-transformers
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4,<0.4.2",
    "langchain-chroma>=1.1",
    "rank-bm25>=0.2.2",
    "kiwipiepy>=0.23.2",
    "sentence-transformers>=5.6",
    # day70~: 지도 파인튜닝(SFTTrainer 학습, jsonl 데이터셋 불러오기, 학습 기록)
    #   SFTTrainer -> trl, Dataset -> datasets, Trainer 의 장치 배치 -> accelerate, report_to=["mlflow"] -> mlflow
    "trl>=1.8,<2",
    "datasets>=5.0",
    "accelerate>=1.14",
    #   mlflow 3.17 은 import 때 코딩 에이전트용 안내 줄을 찍어, 교안을 만든 3.14 줄기에 맞춘다
    "mlflow>=3.14,<3.15",
    # day70~: 과제 02 자가채점이 저장한 model.safetensors 를 safe_open 으로 직접 연다(transformers 가 함께 설치하지만 직접 import 하므로 적어 둔다)
    "safetensors>=0.6",
    # day70~: Base·Tuned 답 채점(Jev 판사 JevEval, TYPESAFE_API_KEY)
    #   deepeval 은 Jev 를 부를 때 typesafe-sdk 를 그제야 불러온다(import 만으로는 빠진 것이 드러나지 않는다)
    "deepeval>=4.2.9",
    # day72 부록: Jev 1.14 이미지 입력(Box 질문, 이미지 헤더)은 0.7.5 부터 된다
    "typesafe-sdk>=0.7.5",
    # day72 부록 LLM 위키 02: Jev 를 LangChain 에서 부른다(TypeSafeClassifier, Choice)
    "langchain-typesafe>=0.0.1a3",
    # day71~: LoRA 어댑터 학습·불러오기·병합(LoraConfig, get_peft_model, PeftModel, merge_and_unload)
    "peft>=0.19.1,<0.20",
    # day71 부록: 이미지 생성 모델 FLUX.2 [klein] LoRA(Flux2KleinPipeline)
    #   0.40 부터 huggingface-hub>=1.23 와 click>=8.4.2 를 요구해 deepeval(click<8.4)과 함께 설치되지 않는다
    "diffusers>=0.39,<0.40",
    # day71 부록: 학습 그림을 열고 크기를 맞춘다(PIL.Image 를 직접 import 하므로 적어 둔다)
    "pillow>=11",
    # day72~: QLoRA 4비트 불러오기(BitsAndBytesConfig, Linear4bit)와 4비트 단계 값(get_4bit_type). macOS arm64·리눅스·윈도우 휠이 있다
    "bitsandbytes>=0.48",
    # day77: FastAPI 서빙 API(serving_app, shop_api, 교안 00 step 파일)와 노트북의 HTTP 요청. 실습자료 공용 환경과 같은 범위
    "fastapi>=0.133.0,<0.137.0",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "openai>=2.45.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
